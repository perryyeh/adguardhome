services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    hostname: adguardhome
    restart: always
    networks:
      macvlan:
        ipv4_address: ${ipv4}
        ipv6_address: ${ipv6}
        mac_address: ${macaddress}

    volumes:
      - ./../adguardwork:/opt/adguardhome/work
      - ./:/opt/adguardhome/conf

networks:
  macvlan:
    external: true
    name: ${MACVLAN_NET}